    patch:
      operationId: update_relationship_v1_miniapp_relationships__relationship_id__patch
      parameters:
      - in: path
        name: relationship_id
        required: true
        schema:
          title: Relationship Id
          type: string
      - in: header
        name: X-Telegram-Init-Data
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Telegram-Init-Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipUpdateBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipView'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Relationship
      tags:
      - miniapp
  /v1/miniapp/relationships/{relationship_id}/rules:
    post:
      operationId: add_rule_v1_miniapp_relationships__relationship_id__rules_post
      parameters:
      - in: path
        name: relationship_id
        required: true
        schema:
          title: Relationship Id
          type: string
      - in: header
        name: X-Telegram-Init-Data
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Telegram-Init-Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipRule'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Add Rule
      tags:
      - miniapp
  /v1/miniapp/relationships/{relationship_id}/rules/{rule_id}:
    delete:
      operationId: delete_rule_v1_miniapp_relationships__relationship_id__rules__rule_id__delete
      parameters:
      - in: path
        name: relationship_id
        required: true
        schema:
          title: Relationship Id
          type: string
      - in: path
        name: rule_id
        required: true
        schema:
          title: Rule Id
          type: integer
      - in: header
        name: X-Telegram-Init-Data
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Telegram-Init-Data
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Rule
      tags:
      - miniapp
    put:
      operationId: update_rule_v1_miniapp_relationships__relationship_id__rules__rule_id__put
      parameters:
      - in: path
        name: relationship_id
        required: true
        schema:
          title: Relationship Id
          type: string
      - in: path
        name: rule_id
        required: true
        schema:
          title: Rule Id
          type: integer
      - in: header
        name: X-Telegram-Init-Data
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Telegram-Init-Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipRule'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Rule
      tags:
      - miniapp
  /v1/telegram/webhook:
    post:
      operationId: telegram_webhook_v1_telegram_webhook_post
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                title: Response Telegram Webhook V1 Telegram Webhook Post
                type: object
          description: Successful Response
      summary: Telegram Webhook
      tags:
      - telegram
