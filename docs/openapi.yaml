          description: Validation Error
      summary: Help Say
  /v1/assist/soften:
    post:
      operationId: soften_v1_assist_soften_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Soften
  /v1/miniapp/assist/{workflow}:
    post:
      operationId: miniapp_assist_v1_miniapp_assist__workflow__post
      parameters:
      - in: path
        name: workflow
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - in: header
        name: X-Telegram-Init-Data
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Telegram-Init-Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniAppAssistBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Miniapp Assist
      tags:
      - miniapp
  /v1/miniapp/auth:
    post:
      operationId: miniapp_auth_v1_miniapp_auth_post
      parameters:
      - in: header
        name: X-Telegram-Init-Data
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Telegram-Init-Data
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Miniapp Auth
      tags:
      - miniapp
  /v1/miniapp/bootstrap:
    get:
      operationId: bootstrap_v1_miniapp_bootstrap_get
      parameters:
      - in: header
        name: X-Telegram-Init-Data
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Telegram-Init-Data
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Bootstrap
      tags:
      - miniapp
  /v1/miniapp/me/default-relationship/{relationship_id}:
    put:
      operationId: set_default_relationship_v1_miniapp_me_default_relationship__relationship_id__put
      parameters:
      - in: path
        name: relationship_id
        required: true
        schema:
          title: Relationship Id
          type: string
      - in: header
        name: X-Telegram-Init-Data
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Telegram-Init-Data
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Set Default Relationship
      tags:
      - miniapp
  /v1/miniapp/relationships:
    get:
      operationId: list_relationships_v1_miniapp_relationships_get
      parameters:
      - in: header
        name: X-Telegram-Init-Data
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Telegram-Init-Data
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RelationshipView'
                title: Response List Relationships V1 Miniapp Relationships Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Relationships
      tags:
      - miniapp
    post:
      operationId: create_relationship_v1_miniapp_relationships_post
      parameters:
      - in: header
        name: X-Telegram-Init-Data
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Telegram-Init-Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipCreateBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipView'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Relationship
      tags:
      - miniapp
  /v1/miniapp/relationships/{relationship_id}:
    delete:
      operationId: delete_relationship_v1_miniapp_relationships__relationship_id__delete
      parameters:
      - in: path
        name: relationship_id
        required: true
        schema:
          title: Relationship Id
          type: string
      - in: header
        name: X-Telegram-Init-Data
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Telegram-Init-Data
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
