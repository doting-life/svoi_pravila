components:
  schemas:
    AssistRequest:
      additionalProperties: false
      properties:
        language:
          default: ru
          title: Language
          type: string
        relationship_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Relationship Id
        text:
          maxLength: 10000
          minLength: 1
          title: Text
          type: string
        user_id:
          title: User Id
          type: string
      required:
      - user_id
      - text
      title: AssistRequest
      type: object
    AuthResponse:
      properties:
        auth_date:
          title: Auth Date
          type: integer
        user:
          $ref: '#/components/schemas/UserView'
      required:
      - user
      - auth_date
      title: AuthResponse
      type: object
    BootstrapResponse:
      properties:
        relationships:
          items:
            $ref: '#/components/schemas/RelationshipView'
          title: Relationships
          type: array
        user:
          $ref: '#/components/schemas/UserView'
      required:
      - user
      - relationships
      title: BootstrapResponse
      type: object
    DeliveryResponse:
      additionalProperties: false
      properties:
        request_id:
          format: uuid
          title: Request Id
          type: string
        status:
          enum:
          - ok
          - blocked
          - error
          title: Status
          type: string
        structured_result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Structured Result
        text:
          title: Text
          type: string
        version:
          default: '1.0'
          title: Version
          type: string
        workflow:
          $ref: '#/components/schemas/WorkflowName'
      required:
      - request_id
      - workflow
      - status
      - text
      title: DeliveryResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    MiniAppAssistBody:
      additionalProperties: false
      properties:
        language:
          anyOf:
          - maxLength: 16
            type: string
          - type: 'null'
          title: Language
        relationship_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Relationship Id
        text:
          maxLength: 10000
          minLength: 1
          title: Text
          type: string
      required:
      - text
      title: MiniAppAssistBody
      type: object
    RelationshipCreateBody:
      additionalProperties: false
      properties:
        aliases:
          items:
            type: string
          maxItems: 20
          title: Aliases
          type: array
        communication_style:
          additionalProperties: true
          title: Communication Style
          type: object
        relation_type:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Relation Type
        set_as_default:
          default: false
          title: Set As Default
          type: boolean
      title: RelationshipCreateBody
      type: object
    RelationshipRule:
      additionalProperties: false
      properties:
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
        priority:
          default: 0
          title: Priority
          type: integer
        type:
          title: Type
          type: string
        value:
          title: Value
          type: string
      required:
      - type
      - value
      title: RelationshipRule
      type: object
    RelationshipUpdateBody:
      additionalProperties: false
      properties:
        aliases:
          anyOf:
          - items:
              type: string
            maxItems: 20
            type: array
          - type: 'null'
          title: Aliases
        communication_style:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Communication Style
        relation_type:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Relation Type
      title: RelationshipUpdateBody
      type: object
    RelationshipView:
      additionalProperties: false
      properties:
        aliases:
          items:
            type: string
          title: Aliases
          type: array
        communication_style:
          additionalProperties: true
          title: Communication Style
          type: object
        relation_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Relation Type
        relationship_id:
          title: Relationship Id
          type: string
        rules:
          items:
            $ref: '#/components/schemas/RelationshipRule'
          title: Rules
          type: array
        ruleset_version:
          title: Ruleset Version
          type: integer
      required:
      - relationship_id
      - ruleset_version
      title: RelationshipView
      type: object
    RuleBody:
      additionalProperties: false
      properties:
        priority:
          default: 0
          maximum: 1000.0
          minimum: -1000.0
          title: Priority
          type: integer
        type:
          maxLength: 64
          minLength: 1
          title: Type
          type: string
        value:
          maxLength: 2000
          minLength: 1
          title: Value
          type: string
      required:
      - type
      - value
      title: RuleBody
      type: object
    UserView:
      additionalProperties: false
      properties:
        default_relationship_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Relationship Id
        first_name:
          title: First Name
          type: string
        language_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Language Code
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
        telegram_user_id:
          title: Telegram User Id
          type: integer
        user_id:
          title: User Id
          type: string
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
      required:
      - user_id
      - telegram_user_id
      - first_name
      title: UserView
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    WorkflowName:
      enum:
      - soften
      - decode
      - help-say
      title: WorkflowName
      type: string
info:
  title: Свои Правила API
  version: 0.6.0
openapi: 3.1.0
paths:
  /health:
    get:
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Health Health Get
                type: object
          description: Successful Response
      summary: Health
  /v1/assist/decode:
    post:
      operationId: decode_v1_assist_decode_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Decode
  /v1/assist/help-say:
    post:
      operationId: help_say_v1_assist_help_say_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
          description: Successful Response
        '422':
          content:
            application/json:
